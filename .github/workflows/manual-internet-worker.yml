name: Manual Internet Worker

on:
  workflow_dispatch:
    inputs:
      url:
        description: "HTTP/HTTPS URL to fetch"
        required: true
        type: string
      output_name:
        description: "Artifact file name"
        required: false
        default: "download.bin"
        type: string
  push:
    paths:
      - "internet-request.txt"

permissions:
  contents: read

concurrency:
  group: manual-internet-worker
  cancel-in-progress: false

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Fetch URL
        id: fetch
        shell: bash
        env:
          MANUAL_URL: ${{ github.event.inputs.url }}
          MANUAL_OUTPUT: ${{ github.event.inputs.output_name }}
        run: |
          set -euo pipefail

          if [ "${{ github.event_name }}" = "push" ]; then
            URL="$(sed -n '1p' internet-request.txt | tr -d '\r')"
            OUT="$(sed -n '2p' internet-request.txt | tr -d '\r')"
          else
            URL="$MANUAL_URL"
            OUT="$MANUAL_OUTPUT"
          fi

          case "$URL" in
            http://*|https://*) ;;
            *) echo "Only http:// and https:// URLs are allowed" >&2; exit 2 ;;
          esac

          [ -n "$OUT" ] || OUT="download.bin"
          OUT="$(basename "$OUT")"

          curl \
            --fail \
            --location \
            --retry 3 \
            --retry-all-errors \
            --connect-timeout 20 \
            --max-time 300 \
            --user-agent "manual-github-internet-worker/1.0" \
            "$URL" \
            --output "$OUT"

          test -s "$OUT"
          sha256sum "$OUT"
          echo "file=$OUT" >> "$GITHUB_OUTPUT"

      - name: Upload result
        uses: actions/upload-artifact@v4
        with:
          name: internet-result
          path: ${{ steps.fetch.outputs.file }}
          if-no-files-found: error
          retention-days: 1
