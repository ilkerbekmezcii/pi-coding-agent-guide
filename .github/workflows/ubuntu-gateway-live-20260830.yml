name: Ubuntu Gateway Live Test 20260830

on:
  push:

permissions:
  contents: read

jobs:
  internet:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Live outbound HTTPS test
        shell: bash
        run: |
          set -euo pipefail
          echo "RUNNER_OS=$RUNNER_OS"
          echo "NODE=$(node --version)"
          echo "CURL=$(curl --version | head -n1)"
          status=$(curl --silent --show-error --location --output /tmp/example.html --write-out '%{http_code}' --connect-timeout 20 --max-time 60 https://example.com/)
          echo "HTTP_STATUS=$status"
          echo "BYTES=$(wc -c < /tmp/example.html)"
          sha256sum /tmp/example.html
          test "$status" = "200"
          test -s /tmp/example.html
