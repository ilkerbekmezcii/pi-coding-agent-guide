name: Build Android SDK 36 from Debian repositories

on:
  push:
    paths:
      - '.github/workflows/debian-android-sdk-bundle.yml'
  pull_request:
    paths:
      - '.github/workflows/debian-android-sdk-bundle.yml'

permissions:
  contents: read
  issues: write
  pull-requests: write

jobs:
  package-android-sdk:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - name: Build SDK bundle inside Debian 13
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/debian-android-sdk"
          mkdir -p "$OUT"
          docker run --rm -v "$OUT:/out" debian:13 bash -lc '
            set -euo pipefail
            export DEBIAN_FRONTEND=noninteractive
            if [ -f /etc/apt/sources.list.d/debian.sources ]; then
              sed -i "s/^Components: .*/Components: main contrib non-free non-free-firmware/" /etc/apt/sources.list.d/debian.sources
            fi
            apt-get update
            apt-get install -y --no-install-recommends ca-certificates default-jre-headless make po-debconf tar unzip wget zstd
            apt-get install -y --no-install-recommends google-android-build-tools-36.0.0-installer
            apt-get install -y --no-install-recommends google-android-platform-36-installer
            apt-get install -y --no-install-recommends google-android-platform-tools-installer
            apt-get install -y --no-install-recommends google-android-cmdline-tools-19.0-installer
            SDK=/usr/lib/android-sdk
            test -f "$SDK/platforms/android-36/android.jar"
            test -x "$SDK/build-tools/36.0.0/aapt2"
            test -x "$SDK/build-tools/36.0.0/apksigner"
            test -x "$SDK/build-tools/36.0.0/zipalign"
            test -x "$SDK/platform-tools/adb"
            SDKMANAGER="$(find "$SDK/cmdline-tools" -type f -name sdkmanager -perm -111 | head -n1)"
            test -n "$SDKMANAGER"
            {
              echo "Built from Debian 13 (trixie) package repositories"
              dpkg-query -W -f="${Package} ${Version}\n" google-android-build-tools-36.0.0-installer google-android-platform-36-installer google-android-platform-tools-installer google-android-cmdline-tools-19.0-installer
              echo "sdkmanager=$SDKMANAGER"
              "$SDKMANAGER" --version || true
              "$SDK/platform-tools/adb" version | head -n1
              "$SDK/build-tools/36.0.0/aapt2" version
              "$SDK/build-tools/36.0.0/apksigner" version || true
            } | tee /out/packages.txt
            tar --zstd -cf /out/android-sdk-debian-trixie.tar.zst -C /usr/lib android-sdk
            sha256sum /out/android-sdk-debian-trixie.tar.zst > /out/android-sdk-debian-trixie.sha256
          '
          ls -lh "$OUT"
          cat "$OUT/packages.txt"
      - name: Upload SDK bundle
        uses: actions/upload-artifact@v4
        with:
          name: android-sdk-debian-trixie
          path: |
            ${{ runner.temp }}/debian-android-sdk/android-sdk-debian-trixie.tar.zst
            ${{ runner.temp }}/debian-android-sdk/android-sdk-debian-trixie.sha256
            ${{ runner.temp }}/debian-android-sdk/packages.txt
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
      - name: Report run id to PR
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body: `ANDROID_SDK_RUN_ID=${context.runId}`
            })
