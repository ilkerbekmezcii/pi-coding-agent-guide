name: Ephemeral Gateway Test

on:
  push:
    paths:
      - '.github/workflows/ephemeral-gateway-test.yml'
  workflow_dispatch:

jobs:
  connectivity:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Test Android Publisher egress
        shell: bash
        run: |
          set -u
          echo '=== DNS ==='
          getent ahostsv4 androidpublisher.googleapis.com | head -n 5 || true
          echo '=== POST ==='
          curl -sS --max-time 20 \
            -o /tmp/body.txt \
            -D /tmp/headers.txt \
            -w 'HTTP_STATUS=%{http_code}\nREMOTE_IP=%{remote_ip}\n' \
            -X POST \
            'https://androidpublisher.googleapis.com/androidpublisher/v3/applications/com.example.invalid/edits' \
            -H 'Content-Type: application/json' \
            --data '{}' || true
          echo '=== HEADERS ==='
          cat /tmp/headers.txt 2>/dev/null || true
          echo '=== BODY ==='
          cat /tmp/body.txt 2>/dev/null || true
