# final cleanup trigger
name: Final Forced Actions Cleanup
on:
  push:
    paths:
      - '.github/workflows/_cleanup-actions-final.yml'
permissions:
  actions: write
  contents: write
jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Purge remaining run and self-delete
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          CURRENT_RUN: ${{ github.run_id }}
          WORKFLOW_PATH: .github/workflows/_cleanup-actions-final.yml
        shell: bash
        run: |
          set -u
          api="https://api.github.com/repos/${REPO}"
          auth=(-H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" -H "X-GitHub-Api-Version: 2022-11-28")
          for pass in $(seq 1 15); do
            json="$(curl -fsSL "${auth[@]}" "${api}/actions/runs?per_page=100")"
            mapfile -t rows < <(jq -r --arg cur "$CURRENT_RUN" '.workflow_runs[] | select((.id|tostring) != $cur) | [.id,.status] | @tsv' <<<"$json")
            [ "${#rows[@]}" -eq 0 ] && break
            for row in "${rows[@]}"; do
              id="${row%%$'\t'*}"; status="${row#*$'\t'}"
              case "$status" in queued|in_progress|waiting|pending|requested) curl -sS -o /dev/null -X POST "${auth[@]}" "${api}/actions/runs/${id}/cancel" || true; curl -sS -o /dev/null -X POST "${auth[@]}" "${api}/actions/runs/${id}/force-cancel" || true;; esac
            done
            sleep 2
            json="$(curl -fsSL "${auth[@]}" "${api}/actions/runs?per_page=100")"
            mapfile -t ids < <(jq -r --arg cur "$CURRENT_RUN" '.workflow_runs[] | select((.id|tostring) != $cur) | .id' <<<"$json")
            for id in "${ids[@]}"; do curl -sS -o /dev/null -X DELETE "${auth[@]}" "${api}/actions/runs/${id}" || true; done
            sleep 1
          done
          file_sha="$(curl -sS "${auth[@]}" "${api}/contents/${WORKFLOW_PATH}" | jq -r '.sha // empty' 2>/dev/null || true)"
          if [ -n "$file_sha" ]; then body="$(jq -nc --arg sha "$file_sha" '{message:"ops: remove temporary Actions cleanup",sha:$sha}')"; curl -sS -o /dev/null -X DELETE "${auth[@]}" "${api}/contents/${WORKFLOW_PATH}" -d "$body" || true; fi
          cat >/tmp/self-delete.sh <<'EOF'
          #!/usr/bin/env bash
          api="https://api.github.com/repos/${REPO}"
          for i in $(seq 1 180); do
            code="$(curl -sS -o /tmp/run.json -w '%{http_code}' -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/actions/runs/${CURRENT_RUN}" || true)"
            [ "$code" = "404" ] && exit 0
            status="$(jq -r '.status // empty' /tmp/run.json 2>/dev/null || true)"
            if [ "$status" = "completed" ]; then curl -sS -o /dev/null -X DELETE -H "Authorization: Bearer ${GH_TOKEN}" -H "Accept: application/vnd.github+json" "${api}/actions/runs/${CURRENT_RUN}" || true; exit 0; fi
            sleep 1
          done
          EOF
          chmod +x /tmp/self-delete.sh
          RUNNER_TRACKING_ID= nohup /tmp/self-delete.sh >/tmp/self-delete.log 2>&1 &
          curl -sS -o /dev/null -X DELETE "${auth[@]}" "${api}/actions/runs/${CURRENT_RUN}" || true
