name: Build offline Android Library bundle

on:
  pull_request:
    paths:
      - 'offline-android-trigger.txt'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Build complete offline bundle
        shell: bash
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/android-offline-library"
          SDK="$ROOT/android-sdk"
          GRADLE_HOME_OFFLINE="$ROOT/gradle-home"
          TMP="$RUNNER_TEMP/android-offline-downloads"
          mkdir -p "$SDK/cmdline-tools" "$ROOT/gradle" "$ROOT/jdk" "$GRADLE_HOME_OFFLINE" "$TMP"

          curl -fL --retry 5 --retry-all-errors https://dl.google.com/android/repository/commandlinetools-linux-15859902_latest.zip -o "$TMP/cmdline.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$TMP/cmdline.zip" | sha256sum -c -
          unzip -q "$TMP/cmdline.zip" -d "$TMP/cmdline"
          mv "$TMP/cmdline/cmdline-tools" "$SDK/cmdline-tools/latest"
          export ANDROID_HOME="$SDK"
          export ANDROID_SDK_ROOT="$SDK"
          export PATH="$SDK/cmdline-tools/latest/bin:$SDK/platform-tools:$PATH"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install 'platform-tools' 'platforms;android-36' 'build-tools;36.0.0'

          curl -fL --retry 5 --retry-all-errors https://services.gradle.org/distributions/gradle-8.11.1-bin.zip -o "$TMP/gradle.zip"
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  '"$TMP/gradle.zip" | sha256sum -c -
          unzip -q "$TMP/gradle.zip" -d "$ROOT/gradle"

          cp -a "$JAVA_HOME/." "$ROOT/jdk/"

          PRIME="$RUNNER_TEMP/offline-primer"
          mkdir -p "$PRIME/app/src/main/java/offline/primer"
          cat > "$PRIME/settings.gradle" <<'EOF'
          pluginManagement { repositories { google(); mavenCentral(); gradlePluginPortal() } }
          dependencyResolutionManagement { repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS); repositories { google(); mavenCentral() } }
          rootProject.name='offline-primer'
          include ':app'
          EOF
          cat > "$PRIME/build.gradle" <<'EOF'
          plugins {
            id 'com.android.application' version '8.9.2' apply false
            id 'org.jetbrains.kotlin.android' version '2.0.21' apply false
          }
          EOF
          cat > "$PRIME/app/build.gradle" <<'EOF'
          plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
          }
          android {
            namespace 'offline.primer'
            compileSdk 36
            defaultConfig { applicationId 'offline.primer'; minSdk 24; targetSdk 36; versionCode 1; versionName '1.0' }
          }
          dependencies {
            implementation 'androidx.core:core-ktx:1.15.0'
            implementation 'androidx.appcompat:appcompat:1.7.0'
            implementation 'com.google.android.material:material:1.12.0'
            implementation 'androidx.constraintlayout:constraintlayout:2.2.1'
            implementation 'com.android.billingclient:billing:7.1.1'
            implementation 'com.google.android.gms:play-services-ads:24.1.0'
          }
          EOF
          cat > "$PRIME/app/src/main/AndroidManifest.xml" <<'EOF'
          <manifest xmlns:android="http://schemas.android.com/apk/res/android"><application android:theme="@style/AppTheme"/></manifest>
          EOF
          mkdir -p "$PRIME/app/src/main/res/values"
          cat > "$PRIME/app/src/main/res/values/styles.xml" <<'EOF'
          <resources><style name="AppTheme" parent="Theme.MaterialComponents.DayNight.NoActionBar"/></resources>
          EOF
          cat > "$PRIME/app/src/main/java/offline/primer/MainActivity.kt" <<'EOF'
          package offline.primer
          import android.app.Activity
          class MainActivity: Activity()
          EOF
          printf 'sdk.dir=%s\n' "$SDK" > "$PRIME/local.properties"
          export GRADLE_USER_HOME="$GRADLE_HOME_OFFLINE"
          "$ROOT/gradle/gradle-8.11.1/bin/gradle" -p "$PRIME" --no-daemon :app:assembleDebug

          find "$GRADLE_HOME_OFFLINE" -type f \( -name '*.lock' -o -name 'gc.properties' \) -delete || true

          cat > "$ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export JAVA_HOME="$R/jdk"
          export ANDROID_HOME="$R/android-sdk"
          export ANDROID_SDK_ROOT="$R/android-sdk"
          export GRADLE_USER_HOME="$R/gradle-home"
          export PATH="$R/jdk/bin:$R/android-sdk/cmdline-tools/latest/bin:$R/android-sdk/platform-tools:$R/android-sdk/build-tools/36.0.0:$R/gradle/gradle-8.11.1/bin:$PATH"
          EOF
          chmod +x "$ROOT/activate.sh"

          cat > "$ROOT/README.txt" <<'EOF'
          Offline Android build toolchain for Linux x86_64.
          Includes JDK 21, Android Command-Line Tools 15859902, Platform 36,
          Build-Tools 36.0.0, Platform-Tools, Gradle 8.11.1 and a primed
          Gradle dependency cache for AGP 8.9.2 / Kotlin 2.0.21 plus common AndroidX,
          Material, Billing and Ads dependencies.
          Use: source activate.sh
          For offline Gradle builds use --offline.
          Project-specific dependencies not present in gradle-home still require pre-caching.
          EOF

          source "$ROOT/activate.sh"
          java -version
          sdkmanager --version | head -n 1
          adb version | head -n 1
          aapt2 version
          apksigner --version
          zipalign -h >/dev/null 2>&1 || true
          gradle --version | head -n 8
          test -f "$SDK/platforms/android-36/android.jar"

          tar --zstd -cf "$RUNNER_TEMP/Android_Offline_Toolchain_API36_Linux_x86_64.tar.zst" -C "$ROOT" .
          sha256sum "$RUNNER_TEMP/Android_Offline_Toolchain_API36_Linux_x86_64.tar.zst" > "$RUNNER_TEMP/Android_Offline_Toolchain_API36_Linux_x86_64.tar.zst.sha256"
          du -sh "$ROOT"
          ls -lh "$RUNNER_TEMP/Android_Offline_Toolchain_API36_Linux_x86_64.tar.zst"

      - name: Upload offline bundle
        uses: actions/upload-artifact@v4
        with:
          name: Android_Offline_Toolchain_API36_Linux_x86_64
          path: |
            ${{ runner.temp }}/Android_Offline_Toolchain_API36_Linux_x86_64.tar.zst
            ${{ runner.temp }}/Android_Offline_Toolchain_API36_Linux_x86_64.tar.zst.sha256
          compression-level: 0
          retention-days: 1
          if-no-files-found: error
