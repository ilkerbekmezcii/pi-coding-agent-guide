name: Library Android Toolchain

on:
  pull_request:
    paths:
      - 'library-android-trigger.txt'

permissions:
  contents: read

jobs:
  bundle:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Build portable toolchain
        shell: bash
        env:
          RELAY: https://avpjpoywjyhnvbaqxyip.supabase.co/functions/v1/blackchess-public-probe
        run: |
          set -euo pipefail
          ROOT="$RUNNER_TEMP/toolchain"
          SDK="$ROOT/android-sdk"
          TMP="$RUNNER_TEMP/downloads"
          mkdir -p "$SDK/cmdline-tools" "$ROOT/gradle" "$TMP"

          get(){ curl -fL --retry 5 --retry-all-errors --connect-timeout 20 --max-time 600 "$1" -o "$2"; }

          get "$RELAY/file/android-cli" "$TMP/cli.zip"
          echo '4e4c464f145a7512b57d088ac6c278c03c9eea610886b35a5e0804e74eedf583  '"$TMP/cli.zip" | sha256sum -c -
          unzip -q "$TMP/cli.zip" -d "$TMP/cli"
          mv "$TMP/cli/cmdline-tools" "$SDK/cmdline-tools/latest"

          get "$RELAY/sdk/repository2-1.xml" "$TMP/repository.xml"
          python3 - "$TMP/repository.xml" "$TMP/packages.txt" <<'PY'
          import sys, xml.etree.ElementTree as ET
          root=ET.parse(sys.argv[1]).getroot()
          out=sys.argv[2]
          def n(t): return t.rsplit('}',1)[-1]
          wanted=['platforms;android-36','build-tools;36.0.0','platform-tools']
          found={}
          for rp in root.iter():
              if n(rp.tag)!='remotePackage' or rp.attrib.get('path') not in wanted: continue
              key=rp.attrib['path']
              for a in rp.iter():
                  if n(a.tag)!='archive': continue
                  host=None; url=None; checksum=None; ctype=''
                  for x in a.iter():
                      k=n(x.tag); text=(x.text or '').strip()
                      if k=='host-os': host=text
                      elif k=='url' and text: url=text
                      elif k=='checksum' and text: checksum=text; ctype=x.attrib.get('type','')
                  if host and host!='linux': continue
                  if url: found[key]=(url,ctype,checksum or ''); break
          missing=set(wanted)-set(found)
          if missing: raise SystemExit('missing '+str(missing))
          with open(out,'w') as f:
              for k in wanted: f.write('|'.join((k,*found[k]))+'\n')
          PY

          install_zip(){
            z="$1"; d="$2"; w="$(mktemp -d)"; unzip -q "$z" -d "$w"; shopt -s dotglob nullglob
            e=("$w"/*); mkdir -p "$d"
            if [ "${#e[@]}" -eq 1 ] && [ -d "${e[0]}" ]; then cp -a "${e[0]}/." "$d/"; else cp -a "$w/." "$d/"; fi
            rm -rf "$w"
          }

          while IFS='|' read -r key url ctype checksum; do
            z="$TMP/$(echo "$key"|tr ';/' '__').zip"
            get "$RELAY/sdk/$url" "$z"
            unzip -tq "$z" >/dev/null
            if [ -n "$checksum" ]; then
              case "$ctype" in
                sha1|SHA-1) echo "$checksum  $z" | sha1sum -c -;;
                sha256|SHA-256) echo "$checksum  $z" | sha256sum -c -;;
              esac
            fi
            case "$key" in
              platforms\;android-36) d="$SDK/platforms/android-36";;
              build-tools\;36.0.0) d="$SDK/build-tools/36.0.0";;
              platform-tools) d="$SDK/platform-tools";;
            esac
            install_zip "$z" "$d"
          done < "$TMP/packages.txt"

          mkdir -p "$SDK/licenses"
          printf '%s\n' 24333f8a63b6825ea9c5514f83c2829b004d1fee d56f5187479451eabf01fb78af6dfcb131a6481e > "$SDK/licenses/android-sdk-license"

          get "$RELAY/file/gradle-8.11.1" "$TMP/gradle.zip"
          echo 'f397b287023acdba1e9f6fc5ea72d22dd63669d59ed4a289a29b1a76eee151c6  '"$TMP/gradle.zip" | sha256sum -c -
          unzip -q "$TMP/gradle.zip" -d "$ROOT/gradle"

          cat > "$ROOT/activate.sh" <<'EOF'
          #!/usr/bin/env bash
          R="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export ANDROID_HOME="$R/android-sdk"
          export ANDROID_SDK_ROOT="$R/android-sdk"
          export PATH="$R/android-sdk/platform-tools:$R/android-sdk/cmdline-tools/latest/bin:$R/android-sdk/build-tools/36.0.0:$R/gradle/gradle-8.11.1/bin:$PATH"
          EOF
          chmod +x "$ROOT/activate.sh"
          cat > "$ROOT/README.txt" <<'EOF'
          Portable Android build toolchain for Linux x86_64.
          Includes Command-Line Tools 15859902, Android Platform 36, Build-Tools 36.0.0,
          current Platform-Tools, and Gradle 8.11.1. Requires JDK 17+; JDK 21 recommended.
          Run: source activate.sh
          EOF

          test -f "$SDK/platforms/android-36/android.jar"
          test -x "$SDK/platform-tools/adb"
          test -x "$SDK/build-tools/36.0.0/aapt2"
          test -x "$SDK/build-tools/36.0.0/apksigner"
          test -x "$SDK/build-tools/36.0.0/zipalign"
          test -x "$ROOT/gradle/gradle-8.11.1/bin/gradle"
          "$SDK/platform-tools/adb" version
          "$SDK/build-tools/36.0.0/aapt2" version
          "$ROOT/gradle/gradle-8.11.1/bin/gradle" --version | head -n 8

          tar --zstd -cf "$RUNNER_TEMP/android-toolchain-api36-linux-x86_64.tar.zst" -C "$ROOT" .
          sha256sum "$RUNNER_TEMP/android-toolchain-api36-linux-x86_64.tar.zst" > "$RUNNER_TEMP/android-toolchain-api36-linux-x86_64.tar.zst.sha256"
      - uses: actions/upload-artifact@v4
        with:
          name: android-toolchain-api36-linux-x86_64
          path: |
            ${{ runner.temp }}/android-toolchain-api36-linux-x86_64.tar.zst
            ${{ runner.temp }}/android-toolchain-api36-linux-x86_64.tar.zst.sha256
          compression-level: 0
          retention-days: 1
